default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "12345") %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>

development:
  <<: *default
  database: lap_shop_development

test:
  <<: *default
  database: lap_shop_test

production:
  primary:
    <<: *default
    database: lap_shop_production
  cache:
    <<: *default
    database: lap_shop_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: lap_shop_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: lap_shop_production_cable
    migrations_paths: db/cable_migrate
